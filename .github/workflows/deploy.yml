name: "Godot 4.6 CI/CD Web Export"
on:
  push:
    branches:
      - main  # Triggers the build whenever you push to main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Export Web Build using Godot
        uses: firebelley/godot-export@v8.0.0
        with:
        godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.6/Godot_v4.6-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.6/Godot_v4.6-stable_export_templates.tpz
          presets_to_export: "Web"
          relative_project_path: ./
          archive_output: false

      - name: Fix Godot 4 SharedArrayBuffer for GitHub Pages
        run: |
          cd ${{ github.workspace }}/builds/Web
          curl -fsSL https://githubusercontent.com -o coi-serviceworker.js
          sed -i 's|<script>|<script src="coi-serviceworker.js"></script><script>|g' index.html

      # ----------------------------------------------------
      # Deployment Destination 1: GitHub Pages
      # ----------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: builds/Web
          branch: gh-pages 

      # ----------------------------------------------------
      # Deployment Destination 2: Itch.io (Via Butler)
      # ----------------------------------------------------
      - name: Deploy to Itch.io
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          GAME: idle-music-game        
          USER: lunarmousestudios         
          PACKAGE: builds/Web
