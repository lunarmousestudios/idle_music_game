name: "Godot 4.6 CI/CD Web Export"
on:
  push:
    branches:
      - main  # Triggers the build whenever you push to main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Export Web Build using Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=export_templates.tpz&platform=templates
          presets_to_export: "Web"
          relative_project_path: ./
          relative_export_path: ./builds
          archive_output: false

      # ----------------------------------------------------
      # Deployment Destination Itch.io (Via Butler)
      # ----------------------------------------------------
      - name: Deploy to Itch.io
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: idle-music-game
          ITCH_USER: lunarmousestudios
          PACKAGE: builds
